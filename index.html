<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極鮮海源 · 冷凍魚貨 ERP</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0}header{padding:20px;background:#111827;position:sticky;top:0}main{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{background:#0891b2;color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#94a3b8}.price{color:#67e8f9;font-weight:700}.stock{color:#86efac}input,select,textarea{width:100%;box-sizing:border-box;background:#0f172a;color:white;border:1px solid #475569;border-radius:8px;padding:10px;margin:5px 0 12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #334155;text-align:left}.hide{display:none}.ok{color:#86efac}.err{color:#fda4af}</style></head><body><header><b>🐟 極鮮海源 · 冷凍魚貨 ERP</b><div class="muted">Supabase 雲端永久儲存｜客戶下單・庫存・訂單管理</div></header><main><div class="tabs"><button onclick="show('shop')">客戶下單</button><button onclick="show('inventory')">冷凍庫存</button><button onclick="show('orders')">訂單管理</button></div><div id="msg"></div><section id="shop"><h2>冷凍海鮮宅配</h2><div id="products" class="grid"></div><div class="card"><h3>購物車</h3><div id="cart"></div><label>收件人</label><input id="name"><label>手機</label><input id="phone"><label>配送種類</label><select id="dtype"><option value="HOME">住家冷凍宅配</option><option value="711">7-11 冷凍店取</option></select><label>縣市</label><input id="city" placeholder="例如：苗栗縣"><label>地址 / 7-11 門市</label><input id="address"><label>備註</label><textarea id="note"></textarea><button class="btn" onclick="checkout()">確認下單並永久儲存</button></div></section><section id="inventory" class="hide"><h2>冷凍庫存管理</h2><div id="inv"></div></section><section id="orders" class="hide"><h2>訂單與冷凍出貨</h2><div id="orderList"></div></section></main><script>const U='https://makrioczmoycsmwgwugy.supabase.co',K='sb_publishable_pxlHMjhFNtlGCVL7PkmyEQ_InJdZBZ-';let products=[],cart=[];async function api(p,o={}){let r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}function msg(t,e=0){document.querySelector('#msg').innerHTML='<div class="card '+(e?'err':'ok')+'">'+t+'</div>'}function show(id){['shop','inventory','orders'].forEach(x=>document.querySelector('#'+x).classList.toggle('hide',x!==id));if(id==='orders')loadOrders()}async function load(){try{products=await api('products?select=*&order=id');renderProducts();renderInv()}catch(e){msg('資料庫連線失敗：'+e.message,1)}}function renderProducts(){document.querySelector('#products').innerHTML=products.map((p,i)=>`<div class="card"><b>${p.name}</b><div class="muted">${p.origin}｜${p.spec}</div><p class="price">NT$ ${p.price}</p><p class="stock">庫存 ${p.stock}</p><button class="btn" onclick="add(${i})" ${p.stock<1?'disabled':''}>加入購物車</button></div>`).join('')}function add(i){let p=products[i],x=cart.find(x=>x.productId===p.id);if(x)x.qty++;else cart.push({productId:p.id,name:p.name,price:p.price,qty:1});renderCart()}function renderCart(){let total=cart.reduce((a,x)=>a+x.price*x.qty,0);document.querySelector('#cart').innerHTML=cart.length?cart.map(x=>`<div>${x.name} × ${x.qty}　NT$ ${x.price*x.qty}</div>`).join('')+`<h3>合計 NT$ ${total}</h3>`:'尚未選購商品'}function renderInv(){document.querySelector('#inv').innerHTML='<div class="card"><table><tr><th>商品</th><th>產地</th><th>庫位</th><th>庫存</th></tr>'+products.map(p=>`<tr><td>${p.name}</td><td>${p.origin}</td><td>${p.freezer_location||''}</td><td>${p.stock}</td></tr>`).join('')+'</table></div>'}async function checkout(){if(!cart.length)return msg('請先選擇商品',1);let n=name.value.trim(),ph=phone.value.trim(),a=address.value.trim();if(!n||!ph||!a)return msg('請填完整收件人、手機與配送地址',1);for(let x of cart){let p=products.find(p=>p.id===x.productId);if(!p||p.stock<x.qty)return msg(p.name+' 庫存不足',1)}let id='ORD-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.floor(1000+Math.random()*9000),total=cart.reduce((s,x)=>s+x.price*x.qty,0);try{await api('orders',{method:'POST',body:JSON.stringify({id,customer_name:n,customer_phone:ph,delivery_type:dtype.value,city:city.value,district:'',address_or_store:a,order_date:new Date().toISOString(),total_amount:total,status:'待處理',logistics_no:'',note:note.value||'低溫 -18°C 配送'})});await api('order_items',{method:'POST',body:JSON.stringify(cart.map(x=>({order_id:id,product_id:x.productId,name:x.name,qty:x.qty,price:x.price})))});for(let x of cart){let p=products.find(p=>p.id===x.productId);p.stock-=x.qty;await api('products?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify({stock:p.stock})})}cart=[];renderCart();renderProducts();renderInv();msg('訂單 '+id+' 已成立並永久儲存到 Supabase！')}catch(e){msg('下單失敗：'+e.message,1)}}async function loadOrders(){try{let os=await api('orders?select=*,order_items(*)&order=created_at.desc');document.querySelector('#orderList').innerHTML=os.length?os.map(o=>`<div class="card"><b>${o.id}</b>｜${o.customer_name}｜NT$ ${o.total_amount}<div class="muted">${o.address_or_store}</div><div>${(o.order_items||[]).map(i=>i.name+' × '+i.qty).join('、')}</div><label>狀態</label><select onchange="status('${o.id}',this.value)">${['待處理','庫存已扣除/已包裝','冷凍出貨中','已完成'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'尚無訂單'}catch(e){msg(e.message,1)}}async function status(id,s){try{await api('orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:s})});msg('訂單狀態已更新')}catch(e){msg(e.message,1)}}load();renderCart();</script></body></html>
